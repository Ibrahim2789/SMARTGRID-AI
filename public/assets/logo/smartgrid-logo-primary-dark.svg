<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Geometric Timetable Symbol -->
  <g>
    <rect width="64" height="64" rx="16" fill="#242424"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#3E3E3E" stroke-width="1.5"/>
    <line x1="25" y1="12" x2="25" y2="52" stroke="#363636" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="39" y1="12" x2="39" y2="52" stroke="#363636" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="12" y1="25" x2="52" y2="25" stroke="#363636" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="12" y1="39" x2="52" y2="39" stroke="#363636" stroke-width="1.25" stroke-linecap="round"/>
    <rect x="13" y="13" width="9.5" height="38" rx="4.5" fill="#F2D8FA"/>
    <rect x="27" y="13" width="24" height="9.5" rx="4.5" fill="#B8EEEE"/>
    <rect x="27" y="27.25" width="9.5" height="9.5" rx="3.5" fill="#B7F77C"/>
