    <rect x="27" y="41.5" width="9.5" height="9.5" rx="3.5" fill="#F7F6EF"/>
  </g>

  <!-- Wordmark for Dark Surfaces -->
  <text x="80" y="38" fill="#FFFFFF" font-family="'Instrument Serif', Georgia, serif" font-size="31" letter-spacing="-0.02em">SmartGrid</text>
  <rect x="212" y="19" width="36" height="22" rx="6" fill="#B8EEEE"/>
  <text x="230" y="34" fill="#171717" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">AI</text>
  <text x="81" y="54" fill="#9E9D96" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.12em">ACADEMIC TIMETABLE ENGINE</text>
