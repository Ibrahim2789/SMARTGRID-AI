<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Light Mode Icon Container (Deep Charcoal Tile on Light Surfaces) -->
  <rect width="64" height="64" rx="16" fill="#171717"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#303030" stroke-width="1.5"/>

  <!-- Precision Grid Axes -->
  <line x1="25" y1="12" x2="25" y2="52" stroke="#2D2D2D" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="39" y1="12" x2="39" y2="52" stroke="#2D2D2D" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="12" y1="25" x2="52" y2="25" stroke="#2D2D2D" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="12" y1="39" x2="52" y2="39" stroke="#2D2D2D" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Continuous 3-Hour Lab Block (Lavender) -->
  <rect x="13" y="13" width="9.5" height="38" rx="4.5" fill="#F2D8FA"/>

  <!-- Morning Lecture Span (Cyan) -->
  <rect x="27" y="13" width="24" height="9.5" rx="4.5" fill="#B8EEEE"/>

  <!-- Central Solver Pivot Node (Lime) -->
  <rect x="27" y="27.25" width="9.5" height="9.5" rx="3.5" fill="#B7F77C"/>

  <!-- Afternoon Multi-Slot Block (Mint) -->
  <rect x="41.5" y="27.25" width="9.5" height="23.75" rx="4.5" fill="#B8F2E6"/>

  <!-- Lower Lecture Node (Ivory) -->
  <rect x="27" y="41.5" width="9.5" height="9.5" rx="3.5" fill="#F7F6EF"/>
</svg>
